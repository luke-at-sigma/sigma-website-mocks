document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"a945e954-ef09-481f-8abf-6590ce39ef9c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ===== BRAND COLORS =================================== */\n  /* Core */\n  --sigma-blue:        #1A70F1;   /* Primary brand action */\n  --sigma-blue-hover:  #155AC1;\n  --sigma-blue-press:  #08377E;\n  --sigma-blue-50:     #E5EEFA;   /* Toned bg / hover bg */\n  --sigma-blue-100:    #DEE8F8;   /* Secondary accent / light blue */\n  --sigma-blue-200:    #A3C6F9;   /* Disabled-on-blue, subtle icon */\n  --sigma-blue-500:    #1A70F1;   /* alias */\n  --sigma-blue-600:    #155AC1;   /* alias */\n  --sigma-blue-700:    #08377E;   /* Dark blue accent */\n  --sigma-blue-soft:   #F4F9FF;   /* Coolest tint, badge bg */\n  --sigma-blue-light:  #EEF3FF;   /* Section-divider light bg */\n\n  /* Neutrals */\n  --black:        #000000;\n  --shadow-black: #1C1E1E;        /* \"Sigma ShadowBlack\" — body & UI text */\n  --white:        #FFFFFF;\n  --cream:        #FAFAFA;        /* Off-white page bg */\n  --gray-50:      #F6F6F5;        /* Hover bg on light */\n  --gray-100:     #ECECEC;        /* Disabled bg, borders-strong */\n  --gray-200:     #D9D9D9;        /* Disabled text/icon */\n  --gray-300:     #BDBDBD;\n  --gray-400:     #888888;        /* Ad subline gray */\n  --gray-500:     #767474;        /* Secondary text */\n  --gray-700:     #4A4A4A;\n  --light-gray:   #E8E6DC;        /* Brand subtle bg (warm) */\n\n  /* Semantic accents (pulled from layout patterns + button hover/press) */\n  --warning-bg:   #FBEACA;\n  --warning-text: #B34700;\n  --info-bg:      #F4F9FF;\n  --info-text:    #155AC1;\n  --success:      #1F8A5B;\n  --error:        #C8372D;\n\n  /* Foreground / background semantic tokens */\n  --fg-1: var(--shadow-black);    /* Primary text, headings */\n  --fg-2: var(--gray-500);        /* Secondary text, labels */\n  --fg-3: var(--gray-400);        /* Tertiary / meta */\n  --fg-on-blue: var(--white);\n  --bg-1: var(--white);\n  --bg-2: var(--cream);\n  --bg-3: var(--gray-50);\n  --bg-blue: var(--sigma-blue);\n  --bg-blue-soft: var(--sigma-blue-light);\n\n  --border-subtle: var(--gray-100);\n  --border-default: #E0E0DD;\n  --border-strong: var(--gray-200);\n\n  /* ===== TYPOGRAPHY ==================================== */\n  --font-display: \"Advercase\", \"Instrument Serif\", Georgia, serif;\n  --font-sans:    \"DM Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-mono:    ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* Display scale (Advercase, 400) */\n  --size-display:    96px;\n  --size-h1:         56px;   /* page title */\n  --size-h2:         48px;   /* section heading */\n  --size-h3:         40px;\n  --size-h4:         32px;   /* large card heading */\n  --size-h5:         28px;\n  --size-h6:         22px;   /* small card heading */\n\n  /* Body scale (DM Sans) */\n  --size-lead:       20px;\n  --size-body:       16px;\n  --size-small:      14px;\n  --size-meta:       12px;\n  --size-caption:    10px;\n\n  --lh-tight:        1.1;\n  --lh-display:      1.05;\n  --lh-heading:      1.3;\n  --lh-card-heading: 1.4;\n  --lh-body:         1.5;\n  --lh-data:         1.3;\n\n  /* ===== RADIUS ======================================== */\n  --radius-xs:   4px;     /* badge */\n  --radius-sm:   8px;     /* rectangular button, UI input */\n  --radius-md:   12px;\n  --radius-lg:   16px;    /* card */\n  --radius-xl:   20px;    /* promo card */\n  --radius-2xl:  30px;    /* large announcement card */\n  --radius-3xl:  50px;    /* \"bold rounded\" social */\n  --radius-pill: 999px;\n\n  /* ===== SHADOWS ======================================= */\n  /* Sigma uses very few shadows; UI is mostly flat with hairline borders. */\n  --shadow-focus:  0 0 0 4px rgba(14, 23, 60, 0.10);\n  --shadow-card:   0 1px 2px rgba(28, 30, 30, 0.04),\n                   0 4px 12px rgba(28, 30, 30, 0.04);\n  --shadow-pop:    0 8px 24px rgba(28, 30, 30, 0.08),\n                   0 2px 6px rgba(28, 30, 30, 0.06);\n\n  /* ===== SPACING (4px grid) ============================ */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-7: 32px;\n  --space-8: 40px;\n  --space-9: 56px;\n  --space-10: 76px;\n  --space-11: 96px;\n\n  /* ===== ICON SIZES ==================================== */\n  --icon-sm: 16px;\n  --icon-md: 24px;\n  --icon-lg: 32px;\n\n  /* ===== MOTION ======================================== */\n  --ease-standard: cubic-bezier(0.2, 0.0, 0, 1.0);\n  --ease-in:       cubic-bezier(0.4, 0, 1, 1);\n  --ease-out:      cubic-bezier(0, 0, 0.2, 1);\n  --dur-fast:   120ms;\n  --dur-base:   180ms;\n  --dur-slow:   280ms;\n}\n\n/* ============================================================\n   SEMANTIC ELEMENTS — drop-in defaults\n   ============================================================ */\nbody, .ds-body {\n  font-family: var(--font-sans);\n  font-size: var(--size-body);\n  line-height: var(--lh-body);\n  color: var(--fg-1);\n  background: var(--bg-1);\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, .ds-h1, h2, .ds-h2, h3, .ds-h3, h4, .ds-h4, h5, .ds-h5, h6, .ds-h6 {\n  font-family: var(--font-display);\n  font-weight: 400;             /* Advercase is never bold in display use */\n  color: var(--fg-1);\n  letter-spacing: -0.01em;\n  text-transform: none;          /* NEVER uppercase Advercase */\n  margin: 0;\n}\nh1, .ds-h1 { font-size: var(--size-h1); line-height: var(--lh-heading); }\nh2, .ds-h2 { font-size: var(--size-h2); line-height: var(--lh-heading); }\nh3, .ds-h3 { font-size: var(--size-h3); line-height: var(--lh-heading); }\nh4, .ds-h4 { font-size: var(--size-h4); line-height: var(--lh-card-heading); }\nh5, .ds-h5 { font-size: var(--size-h5); line-height: var(--lh-card-heading); }\nh6, .ds-h6 { font-size: var(--size-h6); line-height: var(--lh-card-heading); }\n\n.ds-display {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--size-display);\n  line-height: var(--lh-display);\n  letter-spacing: -0.02em;\n  text-transform: none;\n}\n\n.ds-lead    { font-family: var(--font-sans); font-size: var(--size-lead);  font-weight: 400; line-height: var(--lh-body); color: var(--fg-1); }\n.ds-body    { font-family: var(--font-sans); font-size: var(--size-body);  font-weight: 400; line-height: var(--lh-body); color: var(--fg-1); }\n.ds-small   { font-family: var(--font-sans); font-size: var(--size-small); font-weight: 400; line-height: var(--lh-data); color: var(--fg-2); }\n.ds-meta    { font-family: var(--font-sans); font-size: var(--size-meta);  font-weight: 400; line-height: var(--lh-data); color: var(--fg-2); }\n.ds-caption { font-family: var(--font-sans); font-size: var(--size-caption); font-weight: 600; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-1); }\n.ds-label   { font-family: var(--font-sans); font-size: var(--size-small); font-weight: 600; line-height: var(--lh-data); color: var(--fg-1); }\n\n.ds-cta-link {\n  font-family: var(--font-sans);\n  font-size: var(--size-meta);\n  font-weight: 500;\n  line-height: 1.1;\n  color: var(--sigma-blue);\n  text-transform: uppercase;\n  letter-spacing: 0.16em;\n  text-decoration: none;\n  border-bottom: 1px solid currentColor;\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n}\n\ncode, kbd, samp, .ds-code {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n  font-variant-numeric: tabular-nums;\n}\n\n/* Numeric/tabular: ALWAYS tabular fi acing:0.14em;text-transform:uppercase;color:var(--sigma-blue);\n  margin:0 0 16px;\n}\n.page .blue{color:var(--sigma-blue);}\n\n/* ---- pill buttons (marketing system) ---- */\n.page .btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:8px;\n  height:48px;padding:0 24px;border-radius:64px;\n  font-family:var(--font-sans);font-size:16px;letter-spacing:-0.16px;\n  font-weight:500;line-height:1;cursor:pointer;border:1px solid transparent;\n  white-space:nowrap;transition:background var(--dur-base) var(--ease-standard),\n    color var(--dur-base) var(--ease-standard),border-color var(--dur-base) var(--ease-standard);\n}\n.page .btn svg{width:18px;height:18px;}\n.page .btn-primary{background:var(--sigma-blue);color:#fff;font-weight:500;}\n.page .btn-primary:hover{background:var(--sigma-blue-hover);}\n.page .btn-primary:active{background:var(--sigma-blue-press);}\n.page .btn-outline{background:#fff;color:var(--sigma-blue);border-color:var(--sigma-blue);font-weight:400;}\n.page .btn-outline:hover{background:var(--sigma-blue-50);}\n.page .btn-ghost{background:transparent;color:var(--ink);}\n.page .btn-ghost:hover{color:var(--sigma-blue);}\n.page .btn-white{background:#fff;color:var(--sigma-blue);font-weight:500;}\n.page .btn-white:hover{background:var(--sigma-blue-50);}\n.page .btn-blueline{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);}\n.page .btn-blueline:hover{background:rgba(255,255,255,.12);}\n.page .btn-sm{height:40px;padding:0 18px;font-size:14px;}\n\n/* ============================================================\n   NAV\n   ============================================================ */\n.page .nav-wrap{position:sticky;top:0;z-index:40;}\n.page .nav{\n  display:flex;align-items:center;justify-content:space-between;gap:24px;\n  height:68px;padding:0 64px;\n  background:rgba(255,255,255,0.86);\n  backdrop-filter:saturate(160%) blur(10px);\n  -webkit-backdrop-filter:saturate(160%) blur(10px);\n  border-bottom:1px solid var(--line);\n}\n.page .nav.on-dark{background:rgba(18,20,23,0.7);border-bottom-color:rgba(255,255,255,.1);}\n.page .nav .logo{display:flex;align-items:center;}\n.page .nav .logo img{height:24px;width:auto;display:block;}\n.page .nav-links{display:flex;align-items:center;gap:28px;}\n.page .nav-links a{font-size:15px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:5px;}\n.page .nav-links a svg{width:13px;height:13px;opacity:.55;}\n.page .nav-links a:hover{color:var(--sigma-blue);}\n.page .nav.on-dark .nav-links a{color:rgba(255,255,255,.82);}\n.page .nav.on-dark .nav-links a:hover{color:#fff;}\n.page .nav-right{display:flex;align-items:center;gap:14px;}\n.page .nav-login{font-size:15px;font-weight:500;}\n.page .nav-login:hover{color:var(--sigma-blue);}\n.page .nav.on-dark .nav-login{color:rgba(255,255,255,.82);}\n\n/* ============================================================\n   HERO — centered (Variation A)\n   ============================================================ */\n.page .hero{padding:72px 0 36px;text-align:center;}\n.page .hero h1{font-size:58px;line-height:1.05;max-width:14ch;margin:0 auto 22px;text-wrap:balance;}\n.page .hero .lede{font-size:19px;line-height:1.5;color:#3d4147;max-width:600px;margin:0 auto 30px;text-wrap:pretty;}\n.page .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}\n.page .hero-micro{margin-top:18px;font-size:13.5px;color:var(--muted);}\n\n/* ============================================================\n   HERO — split (Variation B)\n   ============================================================ */\n.page .hero-split{\n  background:var(--cream);border-bottom:1px solid var(--line);\n  padding:64px 0 60px;\n}\n.page .hero-split .grid{\n  display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;\n}\n.page .hero-split .col-text{text-align:left;}\n.page .hero-split h1{font-size:52px;line-height:1.06;margin:0 0 20px;text-wrap:balance;}\n.page .hero-split .lede{font-size:18px;line-height:1.5;color:#3d4147;max-width:46ch;margin:0 0 28px;}\n.page .hero-split .hero-cta{justify-content:flex-start;}\n.page .hero-split .hero-micro{text-align:left;}\n\n/* ============================================================\n   HERO — video-as-hero (Variation C)\n   ============================================================ */\n.page .hero-stage{\n  background:var(--shadow-black);color:#fff;\n  padding:64px 0 76px;text-align:center;\n}\n.page .hero-stage .eyebrow{color:#7FB0FF;}\n.page .hero-stage h1{font-size:56px;line-height:1.05;color:#fff;max-width:16ch;margin:0 auto 18px;text-wrap:balance;}\n.page .hero-stage .lede{font-size:18px;color:rgba(255,255,255,.74);max-width:600px;margin:0 auto 28px;line-height:1.5;}\n.page .hero-stage .hero-cta{margin-bottom:48px;}\n.page .hero-stage .video{box-shadow:0 40px 100px rgba(0,0,0,.5);}\n\n/* ============================================================\n   HERO — split: copy + live writeback workbook (above the fold)\n   ============================================================ */\n.page .hero{padding:40px 0 60px;background:#fff;}\n.page .hero-grid{display:grid;grid-template-columns:1fr 1.12fr;gap:60px;align-items:center;}\n.page .hero-grid .eyebrow{margin-bottom:16px;}\n.page .hero-grid h1{font-size:50px;line-height:1.06;letter-spacing:-0.022em;margin:0 0 20px;text-wrap:balance;}\n.page .hero-grid .lede{font-size:19px;line-height:1.5;color:#3d4147;max-width:46ch;margin:0 0 28px;text-wrap:pretty;}\n.page .hero-grid .hero-cta{justify-content:flex-start;margin-bottom:16px;}\n.page .hero-grid .hero-micro{margin-top:0;text-align:left;color:var(--muted);}\n\n/* ---- the faux Sigma workbook ---- */\n.page .hero-viz{position:relative;}\n.page .ui{\n  position:relative;background:#fff;border:1px solid var(--gray-100);\n  border-radius:14px;overflow:hidden;\n  box-shadow:0 30px 70px rgba(20,45,95,.16),0 4px 12px rgba(20,45,95,.06);\n}\n.page .ui-top{\n  display:flex;align-items:center;gap:14px;height:50px;padding:0 16px;\n  border-bottom:1px solid var(--gray-100);background:#fff;\n}\n.page .ui-top .wbm{display:inline-flex;align-items:center;}\n.page .ui-top .wbm svg{width:17px;height:auto;display:block;}\n.page .ui-name{font-size:14px;font-weight:600;letter-spacing:-0.1px;color:var(--ink);}\n.page .ui-tabs{display:flex;align-items:center;gap:4px;margin-left:6px;}\n.page .ui-tabs span{font-size:12.5px;font-weight:500;color:var(--gray-500);padding:5px 10px;border-radius:7px;}\n.page .ui-tabs span.on{color:var(--sigma-blue);background:var(--sigma-blue-50);}\n.page .ui-top .sp{flex:1;}\n.page .pillbtn{\n  font-size:12.5px;font-weight:600;color:#fff;background:var(--sigma-blue);\n  padding:7px 14px;border-radius:var(--radius-pill);letter-spacing:-0.1px;\n}\n.page .ui-body{position:relative;padding:18px;background:var(--cream);}\n\n.page .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}\n.page .kpi{background:#fff;border:1px solid var(--gray-100);border-radius:10px;padding:12px 14px;}\n.page .kpi .l{font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-500);margin-bottom:7px;}\n.page .kpi .v{font-family:var(--font-display);font-size:23px;line-height:1;letter-spacing:-0.01em;color:var(--ink);font-variant-numeric:tabular-nums;}\n.page .kpi .v small{font-family:var(--font-sans);font-size:11.5px;font-weight:600;color:#1f8a5b;margin-left:3px;letter-spacing:0;}\n\n.page .tbl{background:#fff;border:1px solid var(--gray-100);border-radius:10px;overflow:hidden;}\n.page .tr{display:grid;grid-template-columns:1.1fr 1fr 1.1fr 0.8fr;align-items:center;border-bottom:1px solid var(--gray-100);}\n.page .tr:last-child{border-bottom:none;}\n.page .tr > div{padding:11px 14px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}\n.page .tr.th > div{font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-500);background:#fafafa;padding-top:9px;padding-bottom:9px;}\n.page .num-c{color:#3d4147;}\n.page .cell-input{position:relative;}\n.page .cell-input > span{\n  display:inline-flex;align-items:center;justify-content:center;width:80px;height:26px;padding:0 9px;border-radius:6px;\n  background:var(--sigma-blue-50);border:1px solid #cfe0fb;font-weight:600;font-size:12.5px;color:var(--sigma-blue-press);\n}\n.page .cell-input #wbVal{font-weight:inherit;}\n.page .cell-input.cell-focus > span{\n  background:#fff;border:1.5px solid var(--sigma-blue);\n  box-shadow:0 0 0 3px rgba(26,112,241,.16);color:var(--ink);\n}\n.page .cell-focus .caret{display:inline-block;width:1.5px;height:13px;margin-left:1px;background:var(--sigma-blue);animation:wb-caret 1.05s steps(1,end) infinite;}\n.page .cell-input:not(.cell-focus) .caret{display:none;}\n.page .cell-input.committed > span{background:#e6f5ec;border-color:#bfe6cf;color:#177249;transition:background .35s,border-color .35s,box-shadow .35s,color .35s;}\n/* click affordance */\n.page .cell-input.ripple::after{content:\"\";position:absolute;inset:-3px;border-radius:9px;border:2px solid var(--sigma-blue);animation:wb-ripple .55s ease-out forwards;pointer-events:none;}\n@keyframes wb-ripple{0%{transform:scale(.82);opacity:.65;}100%{transform:scale(1.18);opacity:0;}}\n.page .wb-cursor{position:absolute;left:0;top:0;z-index:7;opacity:0;pointer-events:none;will-change:transform,opacity;\n  transition:transform .55s cubic-bezier(.34,.02,.2,1),opacity .28s ease;}\n.page .wb-cursor-in{width:21px;height:21px;filter:drop-shadow(0 2px 4px rgba(15,25,45,.4));transition:transform .12s ease;}\n.page .wb-cursor-in svg{width:100%;height:100%;display:block;}\n.page .wb-cursor.tap .wb-cursor-in{transform:scale(.78);}\n.page .tr.commit-flash{animation:wb-rowflash 1.1s ease-out;}\n@keyframes wb-rowflash{0%{background:rgba(34,165,101,.18);}100%{background:transparent;}}\n@keyframes wb-caret{50%{opacity:0;}}\n.page .ok{color:#1f8a5b;font-weight:700;}\n.page .st-editing{color:var(--muted);}\n.page #wbStatus.st-done{color:#1f :14px;overflow:hidden;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.6);}\n.vb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62);}\n.vb-stage .vb-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-family:var(--font-sans);font-size:14px;}\n.vb-bar{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6));}\n.vb-bar svg{width:20px;height:20px;color:#fff;flex-shrink:0;cursor:pointer;}\n.vb-track{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3);position:relative;overflow:hidden;}\n.vb-fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--sigma-blue);border-radius:4px;}\n.vb-tm{font-size:12px;color:#fff;font-variant-numeric:tabular-nums;}\n.vb-close{position:absolute;top:-44px;right:0;width:34px;height:34px;border-radius:17px;border:none;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;}\n.vb-close:hover{background:rgba(255,255,255,.26);}\n.vb-center-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);}\n.vb-center-play svg{width:28px;height:28px;color:#fff;margin-left:4px;}\n<\u002Fstyle>\n<style id=\"offline-subs\">\n  /* Offline standalone: self-contained substitutes for remote brand images */\n  .page .logos-row{gap:46px;}\n  .page .logos-row .wm{font-family:var(--font-sans);font-weight:700;font-size:21px;letter-spacing:-0.02em;color:#737a85;opacity:.78;transition:opacity .2s,color .2s;}\n  .page .logos-row .wm:hover{opacity:1;color:var(--shadow-black);}\n  .page .ac-media.ph{display:flex;align-items:center;justify-content:center;}\n  .page .ac-ph{display:flex;flex-direction:column;align-items:center;gap:13px;}\n  .page .ac-ph svg{width:44px;height:44px;color:var(--sigma-blue);opacity:.9;}\n  .page .ac-ph .lbl{font-family:var(--font-sans);font-size:10.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#7aa0d8;}\n<\u002Fstyle>\n<style>\n  html,body{margin:0;padding:0;background:#fff;}\n  body{font-family:var(--font-sans);}\n  .page .nav-wrap{position:static;}\n  .page .nav{padding-top:6px;padding-bottom:6px;height:auto;min-height:64px;border-bottom:none;}\n  .page .logos{border-top:none;border-bottom:none;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<div class=\"page\" data-screen-label=\"Writeback enablement · video-first\">\n\n  <div class=\"nav-wrap\"><nav class=\"nav\">\n    <a href=\"#\" class=\"logo\"><img src=\"cebbe051-fdf6-454d-a707-1f65ce2b00fb\" alt=\"Sigma\"><\u002Fa>\n    <a href=\"#contact\" class=\"btn btn-primary btn-sm\">Talk to a Sigma expert<\u002Fa>\n  <\u002Fnav><\u002Fdiv>\n\n  <!-- HERO — split: copy left, live writeback workbook right -->\n  <section class=\"hero\">\n    <div class=\"wide hero-grid\">\n      <div>\n        <div class=\"eyebrow\">For Sigma customers<\u002Fdiv>\n        <h1>The warehouse runs your analytics. Now make it run your <span class=\"blue\">apps<\u002Fspan><\u002Fh1>\n        <p class=\"lede\">Writeback turns the reports your team already trusts into apps that capture a decision and act on it, right where the data lives.<\u002Fp>\n        <div class=\"hero-cta\">\n          <a href=\"#contact\" class=\"btn btn-primary\">Talk to a Sigma expert<\u002Fa>\n          <a href=\"#stories\" class=\"btn btn-outline\">See how it works<\u002Fa>\n        <\u002Fdiv>\n        <p class=\"hero-micro\">Built on the warehouse you already connected. No new stack to stand up.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"hero-viz\">\n        <div class=\"ui\">\n          <div class=\"ui-top\">\n            <span class=\"wbm\"><svg viewBox=\"0 0 104 89\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M43.4984 42.9677L0 0.0999756L64.5863 20.6098L43.4984 42.9677Z\" fill=\"#292929\"><\u002Fpath>\n<path d=\"M46.0489 45.4422L81.0029 88.0588L67.1053 23.0491L46.0489 45.4422Z\" fill=\"#292929\"><\u002Fpath>\n<path d=\"M76.7409 88.432L27.3576 67.1413L59.2836 67.1518L76.7409 88.432Z\" fill=\"#292929\"><\u002Fpath>\n<path d=\"M83.7925 0.55914L67.4749 17.8817L51.7455 12.8778L83.7925 0.55914Z\" fill=\"#292929\"><\u002Fpath>\n<path d=\"M78.0177 11.3672L87.2622 2.04482L103.189 11.8158L78.0177 11.3672Z\" fill=\"#292929\"><\u002Fpath>\n<\u002Fsvg><\u002Fspan>\n            <span class=\"ui-name\">Q3 capacity plan<\u002Fspan>\n            <span class=\"ui-tabs\"><span class=\"on\">Plan<\u002Fspan><span>Actuals<\u002Fspan><span>Approvals<\u002Fspan><\u002Fspan>\n            <span class=\"sp\"><\u002Fspan>\n            <span class=\"pillbtn\">Publish<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ui-body\">\n            <div class=\"kpis\">\n              <div class=\"kpi\"><div class=\"l\">In plan<\u002Fdiv><div class=\"v\">$48.2M<\u002Fdiv><\u002Fdiv>\n              <div class=\"kpi\"><div class=\"l\">Adjusted<\u002Fdiv><div class=\"v\" id=\"kpiAdj\">$51.6M <small id=\"kpiDelta\">▲ 7%<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n              <div class=\"kpi\"><div class=\"l\">Pending approvals<\u002Fdiv><div class=\"v\" id=\"kpiPend\">3<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"tbl\">\n              <div class=\"tr th\"><div>Region<\u002Fdiv><div>Forecast<\u002Fdiv><div>Adjustment<\u002Fdiv><div>Status<\u002Fdiv><\u002Fdiv>\n              <div class=\"tr\"><div>West<\u002Fdiv><div class=\"num-c\">12,400<\u002Fdiv><div class=\"cell-input\"><span>+1,800<\u002Fspan><\u002Fdiv><div class=\"ok\">✓<\u002Fdiv><\u002Fdiv>\n              <div class=\"tr\" id=\"wbRow\"><div>Central<\u002Fdiv><div class=\"num-c\">9,210<\u002Fdiv><div class=\"cell-input\" id=\"wbCell\"><span><b id=\"wbVal\">+0<\u002Fb><i class=\"caret\" id=\"wbCaret\"><\u002Fi><\u002Fspan><\u002Fdiv><div id=\"wbStatus\" class=\"st-done\">Synced<\u002Fdiv><\u002Fdiv>\n              <div class=\"tr\"><div>East<\u002Fdiv><div class=\"num-c\">15,070<\u002Fdiv><div class=\"cell-input\"><span>−320<\u002Fspan><\u002Fdiv><div class=\"ok\">✓<\u002Fdiv><\u002Fdiv>\n              <div class=\"tr\"><div>South<\u002Fdiv><div class=\"num-c\">8,540<\u002Fdiv><div class=\"cell-input\"><span>+0<\u002Fspan><\u002Fdiv><div class=\"ok\">✓<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <span class=\"wb-chip\" id=\"wbChip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 0 1 15-6.7L21 8\"><\u002Fpath><path d=\"M21 3v5h-5\"><\u002Fpath><path d=\"M21 12a9 9 0 0 1-15 6.7L3 16\"><\u002Fpath><path d=\"M3 21v-5h5\"><\u002Fpath><\u002Fsvg><span id=\"wbChipText\">Synced to CDW · just now<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"wb-cursor\" id=\"wbCursor\"><div class=\"wb-cursor-in\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 2 L4 18 L8 14 L11 20 L13.5 19 L10.5 13 L16 13 Z\" fill=\"#fff\" stroke=\"#15171a\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LOGO STRIP -->\n  <section class=\"logos\">\n    <div class=\"wide\">\n      <p>Trusted by finance and corporate strategy teams at leading global enterprises<\u002Fp>\n      <div class=\"logos-row\">\n        <span class=\"wm\">Workday<\u002Fspan>\n        <span class=\"wm\">Duolingo<\u002Fspan>\n        <span class=\"wm\">DoorDash<\u002Fspan>\n        <span class=\"wm\">Workato<\u002Fspan>\n        <span class=\"wm\">Clay<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROOF — stat-forward -->\n  <section class=\"proof-sec\" id=\"stories\">\n    <div class=\"wide\">\n      <div class=\"proof-head\">\n        <p class=\"eyebrow\">What customers turned on<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"proof\">\n        <div class=\"q\">\n          <div class=\"label\">On-demand logistics<\u002Fdiv>\n          <blockquote>“The amount of collaboration with Sigma has been really refreshing, and it’s something that we brag about to other vendors.”<\u002Fblockquote>\n          <cite><b>Andrew Huynh<\u002Fb>Senior BI Engineer, DoorDash<\u002Fcite>\n          <a class=\"q-link\" href=\"https://www.sigmacomputing.com/customers/doordash-logs-a-30-increase-in-queries-while-keeping-the-snowflake-cost-constant-with-sigma\" target=\"_blank\" rel=\"noopener\">Read the story →<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"q\">\n          <div class=\"label\">Asset management<\u002Fdiv>\n          <blockquote>“Input Tables from Sigma give our employees the ability to enhance their data by adding their commentary, conducting ‘what-if’ analysis, and telling better data stories.”<\u002Fblockquote>\n          <cite><b>Han Zhang<\u002Fb>Senior Vice President, Blackstone<\u002Fcite>\n          <a class=\"q-link\" href=\"https://www.sigmacomputing.com/customers/blackstone-leverages-sigma-to-perform-data-analytics-at-cloud-scale\" target=\"_blank\" rel=\"noopener\">Read the story →<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"q\">\n          <div class=\"label\">Consumer goods<\u002Fdiv>\n          <blockquote>“Sigma eliminates the boundary between data entry and data consumption. We are moving a lot faster than we were before.”<\u002Fblockquote>\n          <cite><b>Manav Purohit<\u002Fb>Director, Analytics Engineering, Conagra<\u002Fcite>\n          <a class=\"q-link\" href=\"https://www.sigmacomputing.com/customers/conagra-scales-cpg-analytics\" target=\"_blank\" rel=\"noopener\">Read the story →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- AI APPS — turn on next -->\n  <section class=\"apps-sec\">\n    <div class=\"wide\">\n      <div class=\"apps-head\">\n        <h3>Apps you can turn on next<\u002Fh3>\n        <p>The same governed writeback powers Sigma's prebuilt AI apps. Start from one and adapt it to your team — all on your warehouse.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"apps-grid\">\n        <a class=\"app-card\" href=\"https://www.sigmacomputing.com/resources/library/financial-reporting\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"ac-media ph\"><span class=\"ac-ph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M3 9h18M9 21V9\"><\u002Fpath><\u002Fsvg><span class=\"lbl\">Financial Reporting<\u002Fspan><\u002Fspan><\u002Fspan>\n          <span class=\"ac-body\">\n            <span class=\"ac-cat\">Finance &amp; Accounting<\u002Fspan>\n            <span class=\"ac-name\">Financial Reporting<\u002Fspan>\n            <span class=\"ac-desc\">Live P&amp;L with an AI agent that diagnoses variances, drills to detail, and feeds scenario planning.<\u002Fspan>\n            <span class=\"ac-go\">Explore app <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fa>\n        <a class=\"app-card\" href=\"https://www.sigmacomputing.com/resources/library/pipeline-forecasting\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"ac-media ph\"><span class=\"ac-ph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 4h18M6 9h12M9 14h6M11 19h2\"><\u002Fpath><\u002Fsvg><span class=\"lbl\">Pipeline Forecasting<\u002Fspan><\u002Fspan><\u002Fspan>\n          <span class=\"ac-body\">\n            <span class=\"ac-cat\">Sales &amp; Operations<\u002Fspan>\n            <span class=\"ac-name\">Pipeline Forecasting<\u002Fspan>\n            <span class=\"ac-desc\">Manage territories and books of business, and drive immediate, informed pipeline action.<\u002Fspan>\n            <span class=\"ac-go\">Explore app <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fa>\n        <a class=\"app-card\" href=\"https://www.sigmacomputing.com/resources/library/demand-planning-app\" target=\"_blank\" rel=\"noopener\">\n          <span class=\"ac-media ph\"><span class=\"ac-ph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 17l5-6 4 4 5-7 4 5\"><\u002Fpath><path d=\"M3 21h18\"><\u002Fpath><\u002Fsvg><span class=\"lbl\">Demand Planning<\u002Fspan><\u002Fspan><\u002Fspan>\n          <span class=\"ac-body\">\n            <span class=\"ac-cat\">Supply Chain<\u002Fspan>\n            <span class=\"ac-name\">Demand Planning<\u002Fspan>\n            <span class=\"ac-desc\">Plan and forecast demand on live data. Automate workflows, manage scenarios, and route approvals.<\u002Fspan>\n            <span class=\"ac-go\">Explore app <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CLOSING — blue full-bleed high-impact moment -->\n  <section class=\"close blue\" id=\"contact\">\n    <div class=\"wide\">\n      <p class=\"eyebrow\">Get started<\u002Fp>\n      <h2>Turn writeback on in your environment<\u002Fh2>\n      <p>Bring the workflow that keeps spilling into spreadsheets. In thirty minutes, an expert who's deployed writeback before scopes it on your warehouse and maps the first build with your team.<\u002Fp>\n      <div class=\"expect\"><span>Bring one workflow<\u002Fspan><span>Scope it on your data<\u002Fspan><span>Leave with a build plan<\u002Fspan><\u002Fdiv>\n      <a href=\"#\" class=\"btn btn-white\">Talk to a Sigma expert<\u002Fa>\n      <p class=\"note\">Already have Sigma? Your admin can switch on Input Tables to start writing back today — and an expert will help your team ship the first use case.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<!-- ===== shared video lightbox ===== -->\n<div class=\"vb-lightbox\" id=\"lightbox\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Demo video\">\n  <div class=\"vb-stage\">\n    <button class=\"vb-close\" id=\"vbClose\" aria-label=\"Close\">×<\u002Fbutton>\n    <button class=\"vb-center-play\" id=\"vbCenter\" aria-label=\"Play\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <div class=\"vb-bar\">\n      <svg id=\"vbToggle\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg>\n      <div class=\"vb-track\"><div class=\"vb-fill\" id=\"vbFill\"><\u002Fdiv><\u002Fdiv>\n      <span class=\"vb-tm\" id=\"vbTm\">0:00 / 2:14<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"3d521afe-f05d-4895-ad09-dff761f4656d\"><\u002Fscript>\n<script>\n/* ---- live writeback loop in the hero workbook ---- */\n(function(){\n  var cell=document.getElementById('wbCell'),\n      val=document.getElementById('wbVal'),\n      status=document.getElementById('wbStatus'),\n      row=document.getElementById('wbRow'),\n      kpiAdj=document.getElementById('kpiAdj'),\n      kpiDelta=document.getElementById('kpiDelta'),\n      kpiPend=document.getElementById('kpiPend'),\n      chip=document.getElementById('wbChip'),\n      chipText=document.getElementById('wbChipText'),\n      cursor=document.getElementById('wbCursor'),\n      ui=cell.closest('.ui');\n  if(!cell) return;\n  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var running=false, alive=true;\n  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};\n\n  function setChip(text, synced){chipText.textContent=text;chip.classList.toggle('synced',!!synced);}\n  function tick(el){el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');}\n\n  // resting state: a committed value sitting idle, status shows ✓ Synced\n  function setIdle(value){\n    cell.classList.remove('cell-focus','committed');\n    val.textContent=value;\n    status.className='st-done';status.textContent='Synced';\n  }\n  // the very start / seam of the loop — +0, baseline KPIs, synced\n  function start(){\n    setIdle('+0');\n    kpiAdj.childNodes[0].nodeValue='$51.6M ';kpiDelta.textContent='▲ 7%';\n    kpiPend.textContent='3';\n    setChip('Synced to CDW · just now', true);\n  }\n\n  // move the pointer onto the cell, tap, and drop into edit mode\n  async function clickCell(){\n    var c=cell.getBoundingClientRect(), u=ui.getBoundingClientRect();\n    var x=c.left-u.left+c.width*0.5-4, y=c.top-u.top+c.height*0.5-2;\n    // arrive from slightly below-right\n    cursor.style.transform='translate('+(x+34)+'px,'+(y+30)+'px)';\n    cursor.style.opacity='1';\n    await sleep(60);\n    cursor.style.transform='translate('+x+'px,'+y+'px)';\n    await sleep(600);\n    cursor.classList.add('tap');\n    cell.classList.add('ripple');\n    await sleep(170);\n    cursor.classList.remove('tap');\n    // enter edit mode\n    cell.classList.remove('committed');\n    cell.classList.add('cell-focus');\n    status.className='st-editing';status.textContent='Editing';\n    await sleep(140);\n    cell.classList.remove('ripple');\n    cursor.style.opacity='0';          // pointer fades, keyboard takes over\n    await sleep(260);\n  }\n\n  // clear the cell then type the new value char-by-char\n  async function type(text){\n    val.textContent='';\n    for(var i=0;i<text.length;i++){\n      if(!alive)return; val.textContent+=text[i]; await sleep(150);\n    }\n  }\n\n  // press Enter → write back to the warehouse, KPIs respond, settle to resting\n  async function commitTo(adj, delta, pend){\n    cell.classList.remove('cell-focus');\n    cell.classList.add('committed');\n    row.classList.add('commit-flash');\n    setChip('Writing to CDW…', false);\n    await sleep(150);\n    row.classList.remove('commit-flash');\n    status.className='st-done pop';status.textContent='Synced';\n    await sleep(520);\n    kpiAdj.childNodes[0].nodeValue=adj+' ';tick(kpiAdj);\n    kpiDelta.textContent=delta;\n    kpiPend.textContent=pend;tick(kpiPend);\n    await sleep(340);\n    setChip('Synced to CDW · just now', true);\n    await sleep(700);\n    cell.classList.remove('committed');   // settle to the resting pill\n  }\n\n  async function loop(){\n    if(running)return; running=true;\n    while(alive){\n      start();                                 // +0, resting & synced\n      await sleep(1300);\n      await clickCell();                       // click into the cell\n      await type('+640');                      // change 0 → 640\n      await sleep(650);\n      await commitTo('$52.2M','▲ 8%','2');      // Enter → sync\n      await sleep(4000);                        // hold 4s\n      if(!alive)break;\n      await clickCell();                       // click into the cell again\n      await type('+0');                        // change 640 → 0\n      await sleep(650);\n      await commitTo('$51.6M','▲ 7%','3');      // Enter → sync back to baseline\n      await sleep(4000);                        // hold 4s → loops seamlessly to +0\n    }\n    running=false;\n  }\n\n  // only animate while the workbook is on screen\n  if(reduce){\n    // static representative frame for reduced motion\n    setIdle('+640');\n    kpiAdj.childNodes[0].nodeValue='$52.2M ';kpiDelta.textContent='▲ 8%';kpiPend.textContent='2';\n    setChip('Synced to CDW · just now', true);\n  } else if('IntersectionObserver' in window){\n    var io=new IntersectionObserver(function(es){\n      es.forEach(function(e){\n        if(e.isIntersecting){alive=true;loop();}\n        else{alive=false;running=false;}\n      });\n    },{threshold:0.25});\n    io.observe(cell.closest('.ui'));\n  } else { loop(); }\n})();\n<\u002Fscript>\n<script>\n(function(){\n  var lb=document.getElementById('lightbox');\n  var fill=document.getElementById('vbFill');\n  var tm=document.getElementById('vbTm');\n  var center=document.getElementById('vbCenter');\n  var toggle=document.getElementById('vbToggle');\n  var DUR=134, t=0, timer=null, playing=false;\n  function fmt(s){var m=Math.floor(s/60);var ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}\n  function render(){fill.style.width=(t/DUR*100)+'%';tm.textContent=fmt(t)+' / 2:14';}\n  function play(){playing=true;center.style.display='none';toggle.innerHTML='<path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/>';clearInterval(timer);timer=setInterval(function(){t+=0.1;if(t>=DUR){t=DUR;pause();}render();},100);}\n  function pause(){playing=false;clearInterval(timer);toggle.innerHTML='<path d=\"M8 5v14l11-7z\"/>';if(t<DUR)center.style.display='flex';}\n  function open(){t=0;render();lb.classList.add('open');play();}\n  function close(){lb.classList.remove('open');pause();}\n  document.querySelectorAll('.js-play').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();open();});});\n  document.querySelectorAll('.video .ctrls > svg:first-child').forEach(function(g){g.style.cursor='pointer';g.addEventListener('click',function(e){e.stopPropagation();open();});});\n  center.addEventListener('click',function(e){e.stopPropagation();play();});\n  toggle.addEventListener('click',function(e){e.stopPropagation();playing?pause():play();});\n  document.getElementById('vbClose').addEventListener('click',close);\n  lb.addEventListener('click',function(e){if(e.target===lb)close();});\n  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&lb.classList.contains('open'))close();});\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
